spring.application.name=Tofimotia

# ===============================
# DATABASE CONFIG
# ===============================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://trolley.proxy.rlwy.net:30232/railway?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===============================
# SERVER
# ===============================
server.port=${PORT:8080}

# ===============================
# JWT CONFIG
# ===============================
jwt.secret=${JWT_SECRET:mySecretKey123456789012345678901234567890}
jwt.expiration=86400000

# ===============================
# SWAGGER CONFIG
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# LOGGING (optional but helpful)
# ===============================
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
logging.level.org.flywaydb=INFO

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

# ===============================
# PAYMENT CONFIG
# ===============================
payment.mock-mode=true
payment.mock.success-rate=85
payment.mock.processing-delay=1000

# Mock Payment Gateway Keys (replace with real keys in production)
payment.paystack.public-key=${PAYSTACK_PUBLIC_KEY:pk_test_mock_paystack_key}
payment.paystack.secret-key=${PAYSTACK_SECRET_KEY:sk_test_mock_paystack_key}
payment.flutterwave.public-key=${FLUTTERWAVE_PUBLIC_KEY:FLWPUBK_TEST-mock_flutterwave_key}
payment.flutterwave.secret-key=${FLUTTERWAVE_SECRET_KEY:FLWSECK_TEST-mock_flutterwave_key}
payment.stripe.public-key=${STRIPE_PUBLIC_KEY:pk_test_mock_stripe_key}
payment.stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_mock_stripe_key}
